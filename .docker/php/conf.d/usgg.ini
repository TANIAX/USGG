; Settings of the site (the documents go up to 10 MB, the photos are sent one by one)
date.timezone = Europe/Brussels
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
; Errors are logged by the site (writable/logs), not shown
display_errors = Off
log_errors = On
